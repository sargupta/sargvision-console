name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cf-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Cloudflare Pages deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sargvision-swarm.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (static export for Cloudflare Pages)
        env:
          NEXT_PUBLIC_SWARM_WS_URL: wss://sargvision-swarm-bridge.fly.dev/swarm
          NEXT_PUBLIC_SWARM_HTTP_URL: https://sargvision-swarm-bridge.fly.dev
        run: bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .next --project-name=sargvision-swarm --branch=main
